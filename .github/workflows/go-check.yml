name: Go checks

on:
  push:
    branches: [go-rebuild]
  pull_request:
    branches: [go-rebuild]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Resolve dependencies
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/bot
